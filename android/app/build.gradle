import com.android.build.OutputFile

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing. The properties file is never committed. Its location is
// taken from the CHRONO_KEYSTORE_PROPERTIES environment variable, or
// android/keystore.properties if the variable is not set. See
// android/keystore.properties.example and docs/BUILDING.md.
def keystoreProperties = new Properties()
def keystorePropertiesPath = System.getenv('CHRONO_KEYSTORE_PROPERTIES')
def keystorePropertiesFile = keystorePropertiesPath != null ?
        new File(keystorePropertiesPath) : rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    // namespace "com.vicolo.chrono"

    compileSdkVersion 34
    ndkVersion flutter.ndkVersion
    

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Different from upstream (com.vicolo.chrono) so this build installs
        // alongside the official app.
        applicationId "com.oiuyretro.chrono"
        minSdkVersion 21
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()  
        versionName flutterVersionName
        multiDexEnabled true
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Without a keystore.properties file the release APK is left
            // unsigned rather than signed with the debug key.
            signingConfig hasReleaseKeystore ? signingConfigs.release : null

            minifyEnabled true
            shrinkResources true
        }
    }

    applicationVariants.all { variant ->
    variant.outputs.each { output ->
        // For each separate APK per architecture, set a unique version code as described here:
        // http://tools.android.com/tech-docs/new-build-system/user-guide/apk-splits
        def versionCodes = ["armeabi-v7a":1, "arm64-v8a":2, x86_64:3]
        def abi = output.getFilter(OutputFile.ABI)
        if (abi != null) {  // null for the universal-debug, universal-release variants
            output.versionCodeOverride =
                    variant.versionCode * 10 + versionCodes.get(abi)}
      }
    }

    flavorDimensions "app"

    productFlavors {
      prod {
        dimension "app"
        resValue "string", "app_name", "Chrono Custom"
      }

      dev {
        dimension "app"
        resValue "string", "app_name", "Chrono Custom Dev"
        // versionNameSuffix "-dev",
        applicationIdSuffix ".dev"
      }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        // This is for the signed .apk that we post to GitHub, so the dependency metadata isn't relevant.
        includeInApk false
        // Enable dependency metadata when building Android App Bundles.
        // This is for the Google Play Store, so we'll want the metadata.
        includeInBundle true
    }
}



flutter {
    source '../..'
}

